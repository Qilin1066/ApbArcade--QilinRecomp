name: Windows download

# Builds the Windows download (tools/player-kit/package.sh, as Toy
# Commander's): on every push, as an artifact to check; on a version tag
# (vX.Y.Z), attached to that tag's GitHub Release as
# ApbArcade--QilinRecomp-X.Y.Z-windows-x64.zip, once it has been checked on
# Windows (tools/player-kit/check-windows.ps1). No ROMs are used or
# included: players lift their own with the bundled tools.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the release and attach the download

env:
  LLVM_MINGW: "20261104"
  LLVM_MINGW_CROSS_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
  LLVM_MINGW_WINDOWS_SHA256: 552191b5754c49a5a20723276a6fc56541ea1922c4c50b7b669022333fc1b40f

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the tags, for the version of an untagged build
      - name: Annotate compiler messages
        run: echo "::add-matcher::.github/matchers/compilers.json"
      - name: Ninja and zip (Linux, for the cross build)
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build zip
      - name: Get the toolchains (pinned, checked)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          base=https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW
          curl -sSfL -o cross.tar.xz "$base/llvm-mingw-$LLVM_MINGW-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -sSfL -o windows.zip "$base/llvm-mingw-$LLVM_MINGW-ucrt-x86_64.zip"
          echo "$LLVM_MINGW_CROSS_SHA256  cross.tar.xz" | sha256sum -c
          echo "$LLVM_MINGW_WINDOWS_SHA256  windows.zip" | sha256sum -c
          mkdir cross windows
          tar xJf cross.tar.xz -C cross
          unzip -q windows.zip -d windows
          echo "LLVM_MINGW_CROSS=$PWD/cross/llvm-mingw-$LLVM_MINGW-ucrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"
          echo "LLVM_MINGW_WINDOWS=$PWD/windows/llvm-mingw-$LLVM_MINGW-ucrt-x86_64" >> "$GITHUB_ENV"
      - name: Package
        run: |
          # A tag's version must be CMakeLists.txt's; an untagged build's is git describe's (X.Y.Z-N-gHASH).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            cmake_version="$(sed -nE 's/^project\(ApbArcadeQilinRecomp VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CMakeLists.txt)"
            [[ "$version" == "$cmake_version" ]] || { echo "Tag $version and CMake version $cmake_version disagree"; exit 1; }
          else
            version="$(git describe --tags --always --match 'v*')"; version="${version#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          tools/player-kit/package.sh "$version" "$PWD/ApbArcade--QilinRecomp-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ApbArcade--QilinRecomp-${{ env.VERSION }}-windows-x64
          path: ApbArcade--QilinRecomp-${{ env.VERSION }}-windows-x64.zip
          retention-days: 14
    outputs:
      version: ${{ env.VERSION }}

  # The download as a player gets it, on Windows (tools/player-kit/check-windows.ps1):
  # unpacked into a folder whose name has spaces, brackets and letters
  # outside the ANSI code page, its own qilin.exe reading a ROM folder named
  # that way and answering the identify contract, and its own compiler
  # building and starting the game as the launcher does, with
  # link_check.cpp standing in for the lifted ROMs.
  check:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/player-kit
      - uses: actions/download-artifact@v4
        with:
          name: ApbArcade--QilinRecomp-${{ needs.package.outputs.version }}-windows-x64
          path: ${{ runner.temp }}/download
      - name: Check the download
        shell: powershell
        run: |
          $zip = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "download") -Filter *.zip | Select-Object -First 1
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/player-kit/check-windows.ps1 -Zip $zip.FullName -Place $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "check-windows.ps1 failed: $LASTEXITCODE" }

  # The release may already be there (the Linux or macOS download's workflow
  # made it), or be made by one of them at the same moment: upload if it
  # exists, else create it, and once more after a pause if that lost the race.
  release:
    needs: [package, check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ApbArcade--QilinRecomp-${{ needs.package.outputs.version }}-windows-x64
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          zip="ApbArcade--QilinRecomp-$VERSION-windows-x64.zip"
          attach() {
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
            else
              gh release create "$GITHUB_REF_NAME" "$zip" --title "APB QilinRecomp $VERSION" \
                --notes "To play on Windows: download $zip below, unzip it, open the folder and double-click Play APB.exe. On Linux: ApbArcade--QilinRecomp-$VERSION-linux-x86_64.tar.gz, or -linux-arm64.tar.gz for ARM computers such as a Raspberry Pi 4 or 5 (64-bit Raspberry Pi OS only); unpack it and double-click Play APB. Choose your ROM folder (or drag it onto the window); the first start builds the game from it. You need your own ROMs: APB's rev 7 set, MAME's apb (36 files), unzipped into a folder. Changes: CHANGELOG.md."
            fi
          }
          attach || { sleep 20; attach; }
