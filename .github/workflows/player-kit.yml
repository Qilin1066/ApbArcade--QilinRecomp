name: Windows download

# Builds the Windows download (tools/player-kit): on every push, as an
# artifact to check; on a version tag (vX.Y.Z), attached to that tag's GitHub
# Release as ApbArcade--QilinRecomp-X.Y.Z-windows-x64.zip. No ROMs are used or
# included: players lift their own with the bundled tools.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the release and attach the download

env:
  LLVM_MINGW: "20261104"
  LLVM_MINGW_CROSS_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
  LLVM_MINGW_WINDOWS_SHA256: 552191b5754c49a5a20723276a6fc56541ea1922c4c50b7b669022333fc1b40f
  NINJA: v1.13.2
  NINJA_SHA256: 07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Get the toolchains (pinned, checked)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          base=https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW
          curl -sSfL -o cross.tar.xz "$base/llvm-mingw-$LLVM_MINGW-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -sSfL -o windows.zip "$base/llvm-mingw-$LLVM_MINGW-ucrt-x86_64.zip"
          curl -sSfL -o ninja-win.zip "https://github.com/ninja-build/ninja/releases/download/$NINJA/ninja-win.zip"
          curl -sSfL -o COPYING "https://raw.githubusercontent.com/ninja-build/ninja/$NINJA/COPYING"
          echo "$LLVM_MINGW_CROSS_SHA256  cross.tar.xz" | sha256sum -c
          echo "$LLVM_MINGW_WINDOWS_SHA256  windows.zip" | sha256sum -c
          echo "$NINJA_SHA256  ninja-win.zip" | sha256sum -c
          mkdir cross windows ninja
          tar xJf cross.tar.xz -C cross
          unzip -q windows.zip -d windows
          unzip -q ninja-win.zip -d ninja && mv COPYING ninja/
          echo "LLVM_MINGW_CROSS=$PWD/cross/llvm-mingw-$LLVM_MINGW-ucrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"
          echo "LLVM_MINGW_WINDOWS=$PWD/windows/llvm-mingw-$LLVM_MINGW-ucrt-x86_64" >> "$GITHUB_ENV"
          echo "NINJA_WINDOWS=$PWD/ninja" >> "$GITHUB_ENV"
      - name: Package
        run: |
          version="$(sed -nE 's/^project\(ApbArcadeQilinRecomp VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CMakeLists.txt)"
          [[ -n "$version" ]] || exit 1
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "$version" ]] || { echo "Tag and CMake version disagree"; exit 1; }
          else
            version="$version-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          tools/player-kit/package.sh "$version" "$PWD/ApbArcade--QilinRecomp-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ApbArcade--QilinRecomp-${{ env.VERSION }}-windows-x64
          path: ApbArcade--QilinRecomp-${{ env.VERSION }}-windows-x64.zip
          retention-days: 14
    outputs:
      version: ${{ env.VERSION }}

  # The download as a player gets it, on Windows: unpacked into a folder
  # whose name has spaces, brackets and a letter outside the ANSI code page,
  # its own qilin.exe reading that path, and its own compiler, ninja and
  # play.ps1 (under Windows PowerShell 5.1, as Play APB.bat runs it) building
  # and linking APB.exe, with link_check.cpp standing in for the lifted ROMs.
  check:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/player-kit
      - uses: actions/download-artifact@v4
        with:
          name: ApbArcade--QilinRecomp-${{ needs.package.outputs.version }}-windows-x64
          path: ${{ runner.temp }}/download
      - name: Build APB.exe with the download's own tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $place = Join-Path $env:RUNNER_TEMP ("Kit [check] " + [char]0x00e9 + [char]0x0142)
          $zip = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "download") -Filter *.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, $place)   # not Expand-Archive: its destination is a wildcard pattern
          $top = Join-Path $place "ApbArcade--QilinRecomp"
          $qilin = Join-Path $top "kit\qilin.exe"
          & $qilin --version
          if ($LASTEXITCODE -ne 0) { throw "qilin --version failed" }
          # A ROM folder named outside the ANSI code page: qilin must find the file in it (its SHA-1 is wrong, so it isn't "missing").
          $roms = Join-Path $place ("ROMs " + [char]0x0142)
          New-Item -ItemType Directory -Path $roms | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $roms "136051-1101.5t"), (New-Object byte[] 65536))
          $report = (& $qilin verify $roms) -join "`n"
          if ($LASTEXITCODE -eq 0 -or $report -notmatch "136051-1101\.5t +wrong SHA-1") { throw "qilin verify misread a Unicode folder:`n$report" }
          $standIn = Join-Path $place "stand-in"
          New-Item -ItemType Directory -Path $standIn | Out-Null
          Copy-Item -LiteralPath "tools/player-kit/link_check.cpp" -Destination $standIn
          $env:LOCALAPPDATA = Join-Path $place "local"
          $env:APPDATA = Join-Path $place "roaming"
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $top "kit\play.ps1") -BuildOnly -LiftedFrom $standIn
          if ($LASTEXITCODE -ne 0) { throw "play.ps1 failed: $LASTEXITCODE" }
          $apb = Get-Item -LiteralPath (Join-Path $top "APB.exe")
          if ($apb.Length -lt 1MB) { throw "APB.exe is too small: $($apb.Length) bytes" }
          Write-Host "Built $($apb.FullName), $($apb.Length) bytes"

  release:
    needs: [package, check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ApbArcade--QilinRecomp-${{ needs.package.outputs.version }}-windows-x64
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          zip="ApbArcade--QilinRecomp-$VERSION-windows-x64.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "APB QilinRecomp $VERSION" \
              --notes "The Windows download: unpack it and double-click Play APB.bat (see README.txt). You need your own APB rev 7 ROMs. Changes: CHANGELOG.md."
          fi
